name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build
        run: dotnet build NotchFlow.sln -c Release

      - name: Test
        run: dotnet test NotchFlow.sln -c Release --no-build

  macos:
    name: macOS (referência)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: macos
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Security checks
        run: ./Scripts/security-check.sh

      - name: Test
        run: swift test

      - name: Release build
        run: swift build -c release
